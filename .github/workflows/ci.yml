name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # pnpm 12 is a native binary installed by its package's install script, which corepack doesn't run.
      - run: npm install --global pnpm@12.9.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run check test build

  generators:
    # Generates a real service into this throwaway checkout, installs it, then checks, tests and builds it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --global pnpm@12.9.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @example/generators test:generator
