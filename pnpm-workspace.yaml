packages:
  - apps/*
  - packages/*
  - turbo

# Install scripts pnpm may run. None are needed: esbuild and buf ship their binaries as optional platform
# dependencies, and the protobufjs scripts only print notices.
allowBuilds:
  '@apollo/protobufjs': false
  '@bufbuild/buf': false
  esbuild: false
  protobufjs: false

peerDependencyRules:
  allowedVersions:
    # Only @nestjs/graphql's optional CLI plugin uses TypeScript, and the example doesn't use the plugin.
    '@nestjs/graphql>typescript': '7'

# Every third-party version the workspace uses lives here. Packages reference these with `catalog:`.
catalog:
  '@apollo/server': 5.5.1
  '@apollo/subgraph': 2.15.1
  '@as-integrations/express5': 1.1.2
  '@bufbuild/buf': 1.73.0
  '@bufbuild/protobuf': 2.16.0
  '@grpc/grpc-js': 1.14.5
  '@grpc/proto-loader': 0.8.1
  '@nestjs/apollo': 14.0.3
  '@nestjs/common': 12.1.2
  '@nestjs/core': 12.1.2
  '@nestjs/graphql': 14.0.3
  '@nestjs/microservices': 12.1.2
  '@nestjs/platform-express': 12.1.2
  '@nestjs/testing': 12.1.2
  '@react-router/dev': 8.4.0
  '@react-router/node': 8.4.0
  '@react-router/serve': 8.4.0
  '@rspack/cli': 2.2.8
  '@rspack/core': 2.2.8
  '@testing-library/dom': 10.4.2
  '@testing-library/react': 16.3.3
  '@turbo/gen': 2.11.7
  '@types/node': 26.6.4
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/yargs': 17.0.35
  file-system-cache: 2.4.7 # 3.x's bundled build calls require() and fails under Node ESM
  graphql: 16.14.2 # Apollo Server 5 and @apollo/subgraph support graphql 16 only
  inquirer: 14.2.3
  isbot: 5.2.2
  jsdom: 30.1.2
  react: 19.3.0
  react-dom: 19.3.0
  react-router: 8.4.0
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  ts-proto: 2.13.0
  turbo: 2.11.7
  typescript: 7.0.2
  vite: 8.3.2
  vitest: 5.0.3
  yargs: 18.2.0
